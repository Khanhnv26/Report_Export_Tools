name: Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install WiX Toolset
        run: choco install wixtoolset --version=3.14.0 -y

      - name: Run Maven Tests
        run: mvn test

      - name: Package JAR
        run: mvn package -DskipTests

      - name: Package Windows Executable
        run: |
          if (Test-Path "C:\Program Files (x86)\WiX Toolset v3.14\bin") {
            $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.14\bin;" + $env:PATH
          } elseif (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin") {
            $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.11\bin;" + $env:PATH
          }
          jpackage --type exe --name "ReportExportTool" --app-version "1.0.0" --input target/ --main-jar microservice-report-tool-1.0.0.jar --main-class com.report.tool.ReportToolApplication --win-shortcut --win-menu --win-dir-chooser --win-per-user-install --dest dist/
          $builtExe = Get-ChildItem dist/*.exe | Select-Object -First 1
          Copy-Item $builtExe.FullName dist/ReportExportTool.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReportExportTool
          path: dist/ReportExportTool.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ReportExportTool.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
