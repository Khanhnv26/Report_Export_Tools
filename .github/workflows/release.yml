name: Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        run: mvn test

      - name: Package JAR
        run: mvn package -DskipTests

      - name: Package Windows Executable
        run: |
          jpackage --type app-image --name "ReportExportTool" --input target/ --main-jar microservice-report-tool-1.0.0.jar --main-class com.report.tool.ReportToolApplication --dest dist/
          Compress-Archive -Path dist/ReportExportTool -DestinationPath dist/ReportExportTool-windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReportExportTool-windows
          path: dist/ReportExportTool-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ReportExportTool-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
