server.port=8080
spring.application.name=microservice-report-tool

# Cho phep upload file template Excel toi da 50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ========================================================
# CAU HINH DANH SACH DATABASE CAN TONG HOP (READ-REPLICA)
# ========================================================

# Database 1: Vi du Service Don Hang
app.databases[0].id=db_order
app.databases[0].name=Database Đơn Hàng
app.databases[0].url=jdbc:postgresql://localhost:5432/order_db
app.databases[0].username=postgres
app.databases[0].password=password
app.databases[0].driver-class-name=org.postgresql.Driver

# Database 2: Vi du Service Khach Hang
app.databases[1].id=db_user
app.databases[1].name=Database Khách Hàng
app.databases[1].url=jdbc:postgresql://localhost:5432/user_db
app.databases[1].username=postgres
app.databases[1].password=password
app.databases[1].driver-class-name=org.postgresql.Driver
